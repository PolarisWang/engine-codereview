# ============================================================
# Code Review Bot - Project Configuration
# ============================================================
# Each project has:
#   - jira_project_key: prefix used in Jira issue keys (e.g. EV-123)
#   - engine_repo:     git URL for the engine repository
#   - game_repo:       git URL for the game repository
#   - default_branch:  base branch for diff comparison

projects:
  # approver_open_ids: 该项目的审查人(approver) open_id 列表。闭环评审(P2)中,
  # 审查人的 `ok` 批准 / `1 3 5` 标记 / `close` 必须以这些 id 为门控。
  # 留空 → 回退 policy.yaml 的 `policy.agent.admins`。请按项目填写真实 id。
  EV:
    jira_project_key: EV
    name: "EngineVerse"
    engine_repo: "git@gitlab.booming-inc.com:booming/dev/chaos.git"
    game_repo: "git@gitlab.booming-inc.com:booming/dev/engine/cb-engine-verify.git"
    default_branch: main
    approver_open_ids: [ "ou_55bca7b7dae982e96749bd84f57c21e8" ]

  ENG:
    jira_project_key: ENG
    name: "Engine"
    engine_repo: "git@gitlab.booming-inc.com:booming/dev/chaos.git"
    game_repo: "git@gitlab.booming-inc.com:booming/dev/engine/cb-engine-verify.git"
    default_branch: main
    approver_open_ids: [ "ou_55bca7b7dae982e96749bd84f57c21e8" ]

  CB2:
    jira_project_key: CB2
    name: "CB2"
    engine_repo: "git@gitlab.booming-inc.com:booming/dev/projects/conquerorsblade2/chaos-cb-2.git"
    game_repo: "git@gitlab.booming-inc.com:booming/dev/projects/conquerorsblade2/conquerors-blade-2.git"
    default_branch: main
    approver_open_ids: [ "ou_55bca7b7dae982e96749bd84f57c21e8" ]

  Mars:
    jira_project_key: MARS
    name: "Mars"
    engine_repo: "git@gitlab.booming-inc.com:booming/dev/projects/mars/chaos-mars.git"
    game_repo: "git@gitlab.booming-inc.com:booming/dev/projects/mars/mars.git"
    default_branch: main
    approver_open_ids: [ "ou_55bca7b7dae982e96749bd84f57c21e8" ]

  # MS 项目 = Mars 的同套引擎/游戏仓库(用户确认 MS == MARS)。Jira key 是 MS, 与 MARS 不同,
  # identify_project 是精确匹配 jira_project_key, 所以需单独一条, 复用 Mars 的仓库。
  MS:
    jira_project_key: MS
    name: "Mars"
    engine_repo: "git@gitlab.booming-inc.com:booming/dev/projects/mars/chaos-mars.git"
    game_repo: "git@gitlab.booming-inc.com:booming/dev/projects/mars/mars.git"
    default_branch: main
    approver_open_ids: [ "ou_55bca7b7dae982e96749bd84f57c21e8" ]

  Rage:
    jira_project_key: RAGE
    name: "Rage"
    engine_repo: "git@gitlab.booming-inc.com:booming/dev/projects/rage/chaos.git"
    game_repo: "git@gitlab.booming-inc.com:booming/dev/projects/rage/rage.git"
    default_branch: main
    approver_open_ids: [ "ou_55bca7b7dae982e96749bd84f57c21e8" ]
    # engine_default_branch: optional override — engine repo's base may differ
    # from the game repo's default_branch (e.g. "rage/master"). Uncomment to set.
    # engine_default_branch: rage/master

# ============================================================
# Repository mirror dir (where Jenkins clones repos for review)
# ============================================================
workspace:
  # 实际运行工作区（与 paths.workspace 一致；= Jenkinsfile REVIEW_WORKSPACE）
  base_dir: /var/lib/report-server/daily/cr-workspace
  cache_repos: true   # reuse local clones, fetch instead of clone
  # 方案B: 剩余磁盘低于该字节数(默认2GiB)时禁止新建 checkout 目录, 改为复用/拒绝。
  # disk_free_min_bytes: 2147483648

# ============================================================
# 路径（方案B 单一事实源：所有脚本从这读 workspace / state_file，避免各处硬编码漂移）
# ============================================================
paths:
  # review 工作区（checkout + result 文件）。== workspace.base_dir == 运行时的实际值。
  workspace: /var/lib/report-server/daily/cr-workspace
  # 共享 topic 状态文件。事件侧 / Jenkins / orchestrate 全部读这一处。
  state_file: /root/.codereview-pipeline-state.json
  # 历史已处理消息 ID 文件（legacy dedup）。
  reviewed_msg_ids: /root/.codereview-processed-msg-ids.json

# ============================================================
# GitLab（非敏感配置；token/user 仍是 secret，走 env）
# ============================================================
gitlab:
  host: gitlab.booming-inc.com          # API 基址；域名/IP 变更只改这一处

# ============================================================
# 飞书（非敏感配置；app_id/app_secret/webhook 仍是 secret，走 env）
# ============================================================
feishu:
  chat_id: oc_e817ca07b9c71539e334b1701f2054b4   # 正式环境目标群（改一处生效）
  bot_name: "Chaos Code Review"                  # @ 精确匹配的机器人名（飞书 app_name）
  bot_open_id: "ou_1a4385da2771c92b5c05e8c08afe3b47"   # 机器人 open_id（@-gate 用；来自 bot/v3/info）

# ============================================================
# Real-time event subscription server (topic interaction)
# ============================================================
event:
  # Port the event server listens on (0.0.0.0:port). Feishu callbacks hit this.
  port: 8085
  # Feishu open-platform event subscription settings (secrets may also come from
  # env: FEISHU_VERIFICATION_TOKEN / FEISHU_ENCRYPT_KEY).
  # verification_token: ""
  # encrypt_key: ""
  # Where the server reads/writes the shared topic pipeline state.
  state_file: /root/.codereview-pipeline-state.json

# ============================================================
# Claude API settings
# ============================================================
claude:
  model: deepseek-v4-flash
  # LLM API 基址（非敏感；空则走 env ANTHROPIC_BASE_URL / 默认 https://api.anthropic.com）
  base_url: ""
  max_tokens: 8192
  # 反编造阶段2：对初筛"存疑(flag)"的 finding 用另一个独立 LLM session（同默认模型）
  # 做抗附和复核，复核确认(drop)+B 已证符号不存在才真正删除，否则保留。
  # false = 关闭阶段2（只保留 flag，不做二次复核）。
  verify_flags: true
  review_instructions: |
    You are a senior game engine engineer reviewing a merge request.
    Focus on:
    1. Logic correctness and potential bugs
    2. Performance issues
    3. Code style and maintainability
    4. Security concerns
    5. Missing edge case handling

    Rate each finding as: 🔴 Critical, 🟡 Warning, ℹ️ Suggestion
    Summarize at the end with a count of each severity level.

# ============================================================
# rage 式审查复核 (P1-P6 复刻 rage 质量引擎的开关) —— 方案D
# 复刻 rage review-bot 到本仓库, 保真对齐其标准(结构化 findings + 严重/中/轻/建议
# + 闭环 dev-triage + round-N 增量 + 人审 + 复杂飞书 doc)。见
# docs/review-bot-replication-plan.md。
# ============================================================
review:
  # 用 per-topic claude subprocess agent 审查 (Path A) 而非单次 HTTP LLM 调用。
  # 复刻 rage 的 agent 契约: 结构化 findings + 整文件 scope 验证 + 对齐真实代码行。
  # 模型默认 claude-opus-5 (env REVIEW_AGENT_MODEL 覆盖)。
  # true/1/yes -> 启用 agent 路径; 留空/false 回退旧 HTTP 单调用。
  agent_enabled: true
  # 复杂审查(>5文件/100行): 若飞书 app 已授权 docx/drive scope (R2 已人工验证),
  # 生成飞书 doc 全量 + thread 只发 #N index; 未授权则降级为长贴(PlanB, 无需额外 scope)。
  # true -> 尝试 doc, 失败降级; false -> 始终长贴。
  doc_enabled: true
  # 是否给审查人/开发者写回 GitLab resolved(人审集成 P4)。默认 true。
  mark_resolved: true

# ============================================================
# 生命周期 / 并发 / 文案 / 命令词 —— 方案C 配置统一化
# 这些都可在此文件调整, 无需改代码, 调整后重跑/重启生效。
# ============================================================

# ── 生命周期 (topic lifecycle) ──
lifecycle:
  # 话题多久无新回复自动关闭(天)。
  idle_close_days: 2
  auto_close_hours: 1
  # 自动关闭时是否释放 fix-branch MR/删分支。
  auto_close_mr: true

# ── 并发 (concurrency) ──
concurrency:
  # 同时 running 的 review 子进程上限。超出的 topic 排队。
  max_reviews: 6
  # 方案B: 最多同时保留的按-topic 隔离 checkout 目录数(磁盘上限)。
  # 默认= max_reviews 跟随上限; 超过时新话题复用 LRU 目录或排队。
  # max_open_checkout_dirs: 6


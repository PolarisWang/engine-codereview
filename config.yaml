# ── 命令词 (command words) —— 调整识别词在此, 不碰代码 ──
commands:
  optimize: ["优化", "自动优化", "优化代码", "优化并提交"]
  autofix: ["改码", "自动修改", "自动修复", "autofix", "改码并提交"]
  guidance: ["指引", "修改指引", "怎么改"]
  mr: ["mr", "生成mr", "出mr单", "mr单", "更新mr", "更新mr单"]
  status: ["状态", "/状态", "status"]
  close: ["4", "关闭", "关闭话题"]
  deep_dive: ["深入", "deepdive", "深入分析"]
  challenge: ["质疑", "challenge"]
  update_conclusion: ["更新结论", "更新review结论", "修订结论"]
  release: ["发布", "发布版本", "发布release", "release"]

# ── 版本发布（受控，仅用户对话 `@机器人 发布` 触发） ──
release:
  enabled: true
  # 是否用 LLM 把分组版 release note 润色成官方中文（false=纯分组）。
  note_llm: true
  # 本周期 feat 提交数达到该值则 minor+1；默认 patch+1。大版本仅当用户显式 `发布大版本`。
  minor_if_feat_ge: 3
  # 发布后发往的群；空则用 feishu.chat_id / env FEISHU_CHAT_ID。
  chat_id: ""

notify:
  # 版本发布是否自动挂在 deploy/cron 上（false=仅用户对话触发）。保持 false。
  release_hook: false

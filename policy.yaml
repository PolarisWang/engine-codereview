# CodeReview Agent policy — 声明式边界（纵深防御的执行器依据）
#
# 执行器（orchestrate.interact / _approve）只按本表放行或拒绝动作。
# 修改边界 = 改这个文件，不改代码。

agent:
  # 管理员：可对 guarded 动作（如 关闭话题）代替 topic 发起人放行。
  # 填入 Feishu 用户 id（事件消息的 sender_id，形如 ou_xxxxxxxx...）。
  admins:
    - "ou_55bca7b7dae982e96749bd84f57c21e8"   # 王浩川（发帖人）
    # - "ou_xxxxxxxxxxxxx"   # 后续管理员逐条追加

  # 只读工具：任何群成员 @ 都可触发（不改东西）
  invoke_anyone:
    - get_status
    - get_findings
    - generate_patch_preview
    - answer
    - deep_dive
    - challenge

  # 受控动作：需确认门控，且只有 topic 发起人可批准
  guarded:
    # 触发重新审查（会重跑 code_reviewer，读资源）。发起人或管理员可触发。
    re_review:
      approver: "admin_or_owner"

    # 提议修复补丁（进入 pending_patch，等待 @ok）
    apply_patch:
      approver: "topic_owner"
      confirm: ["@ok", "ok", "好的", "执行", "确认"]

    # 自动改码（改码）：在共享 checkout 上跑 claude -p 修改代码并 stage。
    # 会改本地工作树 + 消耗 LLM，故与 apply_patch 同级，仅 topic 发起人可触发。
    auto_edit:
      approver: "topic_owner"

    # 本地应用补丁（@ok 后）
    apply_local:
      approver: "topic_owner"
      confirm: ["@ok", "ok", "好的", "执行", "确认"]

    # 推送到远程 review 分支（@confirm push 后；仅该话题 review_branch）
    push_remote:
      approver: "topic_owner"
      confirm: ["@confirm push", "确认push", "@push", "推"]
      branch: "{topic.review_branch}"      # 只推该话题的 review 分支

    # 自动改码闭环：确认后 push 到新建的 fix 分支 {src}-fix-{task}（机器人生成的修复）
    push_fix_branch:
      approver: "topic_owner"
      confirm: ["@确认", "确认提交", "确认并建mr"]

    # 回退（@撤销）
    rollback:
      approver: "topic_owner"
      confirm: ["@撤销", "@revert", "撤销", "回退"]

    # 关闭话题（终止生命周期）。发起人或 admins 列表中的管理员可触发。
    close_topic:
      approver: "admin_or_owner"

    # 更新审查结论（人工修订 findings 并重渲染方案C 卡）—— 写"结论"
    update_conclusion:
      approver: "topic_owner"

# 并发
lock:
  mode: serial        # 同一 topic 串行

# 副作用范围
scope:
  repo_checkout_only: true   # apply/push 仅在 <workspace>/<repo> 内
